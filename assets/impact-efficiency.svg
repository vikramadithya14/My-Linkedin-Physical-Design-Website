    <ellipse cx="360" cy="216" rx="236" ry="82" stroke="#84c4ae" stroke-opacity=".8" transform="rotate(23 360 216)"/>
    <ellipse cx="360" cy="216" rx="236" ry="82" stroke="#d1d9b6" stroke-opacity=".54"/>
  </g>
  <g fill="#d9efc6"><circle cx="176" cy="118" r="5"/><circle cx="548" cy="128" r="5"/><circle cx="602" cy="218" r="5"/></g>
  <g transform="translate(291 146)">
