<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Performance and efficiency, illustrated</title>
  <desc id="desc">A silicon package sits within three interlocking rings representing power, performance, and area trade-offs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12272f"/><stop offset=".54" stop-color="#213c3d"/><stop offset="1" stop-color="#3b5144"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c7ec9d" stop-opacity=".26"/><stop offset="1" stop-color="#c7ec9d" stop-opacity="0"/></radialGradient>
    <pattern id="lines" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 15h30M15 0v30" stroke="#d0e3ce" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="720" height="440" fill="url(#bg)"/><rect width="720" height="440" fill="url(#lines)"/><ellipse cx="360" cy="220" rx="290" ry="220" fill="url(#glow)"/>
  <g fill="none" stroke-width="2">
