    <rect x="3" y="3" width="132" height="122" rx="9" fill="#172d34" stroke="#88b59b"/>
    <g stroke="#c4ef8c" stroke-width="3"><path d="M-22 24h25M-22 53h25M-22 82h25M-22 111h25M135 24h25M135 53h25M135 82h25M135 111h25M24-22V3M53-22V3M82-22V3M111-22V3M24 125v25M53 125v25M82 125v25M111 125v25"/></g>
