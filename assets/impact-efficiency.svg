  </g>
  <g fill="#e4f0d7" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2"><text x="101" y="65">POWER</text><text x="539" y="70">PERFORMANCE</text><text x="596" y="291">AREA</text></g>
  <g fill="none" stroke="#d8edcb" stroke-width="1" opacity=".6"><path d="M121 72 157 101M572 80l-24 29M599 278l-23-29"/></g>
